name: CodeNexus CI/CD

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]
  workflow_dispatch:

jobs:
  # JOB 1: BUILD & TEST & PUBLISH
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Run Unit Tests
      run: dotnet test tests/CodeNexus.UnitTests/CodeNexus.UnitTests.csproj --configuration Release --verbosity normal

    - name: Publish API
      run: dotnet publish src/CodeNexus.API/CodeNexus.API.csproj -c Release -o ./publish

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: web-deploy-package
        path: ./publish/
        retention-days: 1

  # JOB 2: DEPLOY 
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: success() && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')

    steps:
    - name: Download Artifact
      uses: actions/download-artifact@v4
      with:
        name: web-deploy-package
        path: ./publish/

    - name: Create app_offline.htm
      run: echo "<html><head><title>Updating...</title></head><body><h1>System is updating...</h1></body></html>" > app_offline.htm

    - name: Stop App (Upload app_offline.htm)
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./
        server-dir: /codenexus/
        files: |
          app_offline.htm
      continue-on-error: true

    - name: Wait for app to stop
      run: sleep 10

    - name: Deploy to SmarterASP.Net
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: /codenexus/
        state-name: .ftp-deploy-sync-state.json
        exclude: |
          **/.git*
          **/node_modules/**
          **/.env
          **/bin/**
          **/obj/**

    - name: Wait before restart
      run: sleep 5

    - name: Start App (Remove app_offline.htm)
      run: lftp -c "open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ${{ secrets.FTP_SERVER }}; rm /codenexus/app_offline.htm" || echo "app_offline.htm removal skipped"
      continue-on-error: true

    - name: Wait for app to start
      run: sleep 5
