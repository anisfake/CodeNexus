name: CodeNexus CI/CD

# Kích hoạt khi có Push hoặc PR vào master/develop
on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest # Chạy trên máy ảo Linux

    steps:
    # 1. Tải code về máy ảo
    - uses: actions/checkout@v4

    # 2. Cài đặt .NET 8
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # 3. Restore (Tải thư viện)
    - name: Restore dependencies
      run: dotnet restore

    # 4. Build (Biên dịch code xem có lỗi cú pháp không)
    - name: Build
      run: dotnet build --no-restore --configuration Release

    # 5. Run Unit Tests
    - name: Run Unit Tests
      run: dotnet test tests/CodeNexus.UnitTests/CodeNexus.UnitTests.csproj --configuration Release --verbosity normal

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: success() && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')

    steps:
    # 1. Tải code về máy ảo
    - uses: actions/checkout@v4

    # 2. Cài đặt .NET 8
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # 3. Restore dependencies
    - name: Restore dependencies
      run: dotnet restore

    # 4. Publish ứng dụng
    - name: Publish
      run: dotnet publish src/CodeNexus.API/CodeNexus.API.csproj -c Release -o ./publish

    # 5. Deploy lên SmarterASP.Net qua FTP
    - name: Deploy to SmarterASP.Net
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: /
        state-name: .ftp-deploy-sync-state.json
        dangerous-delete-include: |
          *.dll
          *.pdb
          *.json
          appsettings.*.json