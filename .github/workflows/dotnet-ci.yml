name: CodeNexus CI/CD

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]
  workflow_dispatch:

concurrency:
  group: codenexus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        cache: true
        cache-dependency-path: |
          **/*.csproj
          **/packages.lock.json

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Run Unit Tests
      run: dotnet test tests/CodeNexus.UnitTests/CodeNexus.UnitTests.csproj --configuration Release --no-build --verbosity normal

    - name: Publish API
      run: dotnet publish src/CodeNexus.API/CodeNexus.API.csproj -c Release --no-build --no-restore -o ./publish

    - name: Upload publish artifact
      if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
      uses: actions/upload-artifact@v4
      with:
        name: api-publish
        path: ./publish
        if-no-files-found: error

  deploy_azure:
    runs-on: ubuntu-latest
    needs: build_test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')

    steps:
    - name: Download publish artifact
      uses: actions/download-artifact@v4
      with:
        name: api-publish
        path: ./publish

    - name: Deploy to Azure App Service
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ./publish
