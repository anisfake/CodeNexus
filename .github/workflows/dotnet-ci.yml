name: CodeNexus CI/CD

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]
  workflow_dispatch:

jobs:
  # JOB 1: BUILD & TEST & PUBLISH
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Run Unit Tests
      run: dotnet test tests/CodeNexus.UnitTests/CodeNexus.UnitTests.csproj --configuration Release --verbosity normal

    - name: Publish API
      run: dotnet publish src/CodeNexus.API/CodeNexus.API.csproj -c Release -o ./publish

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: web-deploy-package
        path: ./publish/
        retention-days: 1

  # JOB 2: DEPLOY 
  deploy:
    needs: build
    runs-on: windows-latest
    if: success() && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')

    steps:
    - name: Download Artifact
      uses: actions/download-artifact@v4
      with:
        name: web-deploy-package
        path: ./publish/

    - name: Deploy to Azure App Service
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'codenexus'
        publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
        package: ./publish/
