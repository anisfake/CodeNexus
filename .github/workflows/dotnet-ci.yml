name: CodeNexus CI/CD

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]
  workflow_dispatch:

concurrency:
  group: codenexus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci_cd:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        cache: true
        cache-dependency-path: |
          **/*.csproj
          **/packages.lock.json

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Run Unit Tests
      run: dotnet test tests/CodeNexus.UnitTests/CodeNexus.UnitTests.csproj --configuration Release --no-build --verbosity normal

    - name: Publish API
      run: dotnet publish src/CodeNexus.API/CodeNexus.API.csproj -c Release --no-build --no-restore -o ./publish

    - name: Deploy with WebDeploy
      if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')
      run: |
        $msdeploy = "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"
        & $msdeploy -verb:sync `
          -source:contentPath='${{ github.workspace }}\publish' `
          -dest:contentPath='codenexus-001-site1',computerName='https://${{ secrets.WEBDEPLOY_URL }}/msdeploy.axd?site=codenexus-001-site1',userName='${{ secrets.WEBDEPLOY_USERNAME }}',password='${{ secrets.WEBDEPLOY_PASSWORD }}',authtype='Basic' `
          -enableRule:AppOffline `
          -retryAttempts:5 `
          -retryInterval:5000 `
          -allowUntrusted `
          -disableLink:AppPoolExtension `
          -disableLink:ContentExtension `
          -disableLink:CertificateExtension
      shell: powershell
